<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>근무달력</title>
<!-- 아이폰 「홈 화면에 추가」용 (안드로이드 앱에서는 쓰이지 않음) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 개인용 급여 기준: 안드로이드 앱에만 있음 (공유용 웹에는 없어서 그냥 건너뜀) -->
<script src="personal.js" onerror="this.remove()"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f9; --line:#e6e8ec; --txt:#1c1f24; --sub:#6b7280; --dim:#b8bdc6;
  --tap:#3d6df2; /* 누르거나 입력하는 곳의 테두리 */
  --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  --sun:#e5484d; --sat:#3d6df2; --brand:#3d6df2; --today:#e9f7d9; --todayChip:#c5eb9c;
  --yellow:#ffd400; --dark:#34373c; --red:#e5484d; --green:#2fb176; --purple:#8a5cf5; --orange:#e8590c; --gray:#8a8f98;
  --myrow:#fff8d6; --darkRing:transparent; --shadow:rgba(0,0,0,.15); --mask:rgba(0,0,0,.35);
  color-scheme:light;
}
/* 어두운 화면 */
:root[data-theme="dark"]{
  --bg:#121418; --bg2:#1c1f25; --line:#2b2f37; --txt:#e8eaee; --sub:#9aa1ad; --dim:#5d6470;
  --tap:#6e8cff; --sun:#ff6b70; --sat:#6e8cff; --brand:#6e8cff; --today:#1f3320; --todayChip:#3c6b2c;
  --yellow:#ffd400; --dark:#40454e; --red:#ff6b70; --gray:#8a919c;
  --myrow:#2e2a17; --darkRing:#6b717c; --shadow:rgba(0,0,0,.6); --mask:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="dark"] .badge.st-dark,:root[data-theme="dark"] .wb.st-dark{box-shadow:inset 0 0 0 1.5px var(--darkRing)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:"Samsung One","SamsungOneKorean","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.page{flex:1;display:none;flex-direction:column;min-height:0}
.page.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}

/* 머리 */
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left))}
header .title{font-size:24px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;padding:2px 4px;border:0;background:none}
.pill{border:1.5px solid var(--tap);border-radius:999px;padding:3px 12px;background:none;font-size:14px;font-weight:600}
.navbtn{border:1.5px solid var(--tap);border-radius:10px;background:none;font-size:20px;line-height:1;width:34px;height:34px;padding:0;color:var(--tap)}
header .sp{flex:1}

/* 달력 */
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:14px;font-weight:600;padding:6px 0 4px;border-bottom:1px solid var(--line)}
.dow .s0{color:var(--sun)} .dow .s6{color:var(--sat)}
#grid.all{display:block !important;overflow-y:auto;-webkit-overflow-scrolling:touch}
#grid.all .wk{border-bottom:2px solid var(--line)}
#grid.all .wd,#grid.all .tr{display:grid;grid-template-columns:44px repeat(7,1fr);align-items:center;text-align:center}
#grid.all .wd{background:var(--bg2);font-size:14px;font-weight:600;padding:5px 0;font-variant-numeric:tabular-nums}
#grid.all .wd small{display:block;font-size:9px;font-weight:500;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#grid.all .wd .sun{color:var(--sun)} #grid.all .wd .sat{color:var(--sat)} #grid.all .wd .other{opacity:.35}
#grid.all .wd .today{background:var(--todayChip);border-radius:6px}
#grid.all .tr{height:42px;border-top:1px solid var(--line)}
#grid.all .tr b{font-size:13px;color:var(--sub);font-weight:600}
#grid.all .tr.me{background:var(--myrow)} #grid.all .tr.me b{color:var(--txt)}
#grid.all .tc{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
#grid.all .tc.other{opacity:.35}
#grid.all .tc .badge{width:28px;height:28px;font-size:14px}
#grid.all .tc .badge.st-red,#grid.all .tc .badge.st-blue,#grid.all .tc .badge.st-gray{font-size:16px}
#grid.all .tc .dot{position:absolute;right:6px;top:5px;width:7px;height:7px;border-radius:50%}
#grid.all .tc .dot.rest{background:var(--red)} #grid.all .tc .dot.work{background:var(--sat)}
.pill.on{background:var(--tap);color:#fff}
.allmode .dow{grid-template-columns:44px repeat(7,1fr)} .allmode .dow::before{content:''}
#grid{overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-height:0;touch-action:pan-y}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 2px 2px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.other{background:var(--bg2)}
.cell.other > *{opacity:.35}
.cell.today{background:var(--today)}
.cell .top{align-self:stretch;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:3px;font-size:13px;font-weight:600;padding-left:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell .top .hn{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:-.4px;line-height:1.2;white-space:normal;word-break:break-all;min-width:0}
.cell .top .mt{font-size:10px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis}
.cell.sun .top .d,.cell.hol .top .d{color:var(--sun)}
.cell.hol .top .hn{color:var(--sun)}
.cell.sat:not(.hol) .top .d{color:var(--sat)}
.cell.today .top .d{background:var(--todayChip);border-radius:4px;padding:0 3px}
.cell .bwrap{position:relative;height:40px;display:flex;align-items:center;justify-content:center;margin-top:4px;align-self:stretch}
.cell .bwrap:has(.wcard){height:54px;align-items:flex-start}
.cell .bwrap:has(.wb + .wb){height:66px}
.wcard{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;font-size:10px;font-weight:700;line-height:1.15;letter-spacing:-.4px;white-space:nowrap}
.wb{display:flex;flex-direction:column;align-items:center;border-radius:5px;padding:2px 4px;background:var(--sat);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 1.5px var(--bg)}
.wb.st-yellow{background:var(--yellow);color:#222}
.wb.st-dark{background:var(--dark);color:#fff}
.wb.st-green{background:var(--green)} .wb.st-bluec{background:var(--sat)} .wb.st-purple{background:var(--purple)}
.badge{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:800;line-height:1}
.badge.st-yellow{background:var(--yellow);color:#222}
.badge.st-dark{background:var(--dark);color:#fff}
.badge.st-red{color:var(--red);font-size:20px}
.badge.st-blue{color:var(--sat);font-size:20px}
.badge.st-gray{color:var(--gray);font-size:20px}
.badge.st-green{background:var(--green);color:#fff}
.badge.st-bluec{background:var(--sat);color:#fff}
.badge.st-purple{background:var(--purple);color:#fff}
.badge.off{position:relative}
.badge.off::after{content:'';position:absolute;left:-5px;right:-5px;top:50%;height:7px;transform:translateY(-50%) rotate(-12deg);border-top:2px solid var(--red);border-bottom:2px solid var(--red);opacity:1}
.badge.changed{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--orange)}
.cell .chips{align-self:stretch;display:flex;flex-direction:column;gap:1px;margin-top:3px}
.ev{font-size:10.5px;font-weight:600;line-height:1.35;padding:0 3px;border-radius:2px;word-break:break-all;white-space:pre-wrap}
.ev.memo{color:var(--txt);font-weight:500;padding:0 2px}
.ev.att{display:block;white-space:nowrap;letter-spacing:-.3px}
.ev.c-blue{background:#5b84f0;color:#fff} .ev.c-orange{background:var(--orange);color:#fff}
.ev.c-green{background:var(--green);color:#fff} .ev.c-purple{background:var(--purple);color:#fff}
.ev.c-red{background:var(--red);color:#fff} .ev.c-gray{background:#9aa0a8;color:#fff}
.ev.att{background:none;color:var(--gray);border:1px solid var(--gray);text-align:center}
.ev.att.rest{color:var(--red);border-color:var(--red)}
.ev.att.work{color:var(--sat);border-color:var(--sat)}
/* 근태 아래 작은 출퇴근 시각 */
.cell .tm{font-size:9.5px;font-weight:600;line-height:1.2;text-align:center;letter-spacing:-.5px;white-space:normal;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cell .tm.r{color:var(--red)} .cell .tm.w{color:var(--sat)}
/* 날짜 창 묶음 */
.seg{display:flex;gap:6px;margin:4px 16px 6px}
.seg button{flex:1;border:1.5px solid var(--tap);background:var(--bg);color:var(--tap);border-radius:10px;padding:8px 0;font-size:14px;font-weight:700}
.seg button.on{background:var(--tap);color:#fff}
.seg.sm{margin:10px 0 8px}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.sum th{font-size:12px;color:var(--sub);font-weight:600;padding:6px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--line)}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum tr.g td{font-weight:700;padding-top:14px;border-bottom:0}
table.sum tr.g.rest td{color:var(--red)} table.sum tr.g.work td{color:var(--sat)}
table.sum tr.tot td{font-weight:700;background:var(--bg2)}
table.sum td.z{color:var(--dim)}
table.sum.fix{table-layout:fixed} table.sum.fix td,table.sum.fix th{white-space:nowrap;letter-spacing:-.3px}
h3.gh{display:flex;align-items:baseline;gap:8px}
h3.gh span{font-size:12px;font-weight:500;color:var(--sub)}
h3.gh.rest{color:var(--red)} h3.gh.work{color:var(--sat)}
.chip.rest{border-color:var(--red);color:var(--red)} .chip.rest.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.work{border-color:var(--sat);color:var(--sat)}
.chip.sh.work.on{background:var(--sat);color:#fff;border:1.5px solid var(--sat)}
.chip.sh.work .badge{margin-right:2px}
/* 같은 성격 버튼은 같은 줄·같은 열에: 칸 너비를 똑같이 나눔 */
.cgrid{display:grid;gap:6px}
.cgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cgrid .chip{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding-left:6px;padding-right:6px;white-space:nowrap;border-width:1.5px}
.cgrid .chip.span2{grid-column:span 2}
.cgrid .chip:has(.ck){padding-right:22px;padding-left:22px}
.chip .ck{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px} .chip.work.on{background:var(--sat);border-color:var(--sat);color:#fff}
.entry.rest{border-color:rgba(229,72,77,.45)} .entry.work{border-color:rgba(61,109,242,.45)}

#monthMemo{border-top:1px solid var(--line);padding:6px 16px}
#monthMemo textarea{width:100%;border:1.5px solid var(--tap);border-radius:10px;padding:7px 10px;outline:0;resize:none;font-size:15px;background:none;min-height:30px;max-height:120px;color:var(--txt)}
#monthMemo textarea::placeholder{color:var(--dim)}

/* 아래 탭 */
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav button.on{color:var(--brand);border-top-color:var(--brand)}
nav svg{width:24px;height:24px}

/* 카드 */
h2{font-size:20px;font-weight:700;margin:18px 0 10px}
h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.card{background:var(--bg2);border-radius:14px;padding:14px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:15px}
.kv .v{white-space:nowrap;padding-left:8px;font-weight:700;font-variant-numeric:tabular-nums}
.kv.big .v{font-size:24px;color:var(--brand)}
.kv .s{font-size:12px;color:var(--sub);font-weight:500}
.hr{height:1px;background:var(--line);margin:6px 0}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.statgrid{margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--bg2);border-radius:14px;padding:12px}
.stat .l{font-size:12.5px;color:var(--sub);font-weight:600}
.stat .n{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .n small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
.stat.hi .n{color:var(--brand)}
table.days{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.days th{color:var(--sub);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.days td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.days th:first-child,table.days td:first-child,table.days td:nth-child(2),table.days th:nth-child(2){text-align:left}
details summary{font-size:14px;font-weight:600;padding:10px 0;color:var(--brand)}

/* 입력 */
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row label{font-size:14px;color:var(--sub);min-width:76px}
.inp{border:1.5px solid var(--tap);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:15px;min-width:0}
.inp.sm{width:58px;text-align:center}
.inp.tm{width:132px}
.btn{border:1.5px solid var(--tap);background:var(--bg);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.x{border:1.5px solid var(--tap);border-radius:50%;background:none;color:var(--tap);font-size:15px;width:32px;height:32px;padding:0;flex:none}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--tap);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.chip .badge{width:24px;height:24px;font-size:13px;display:inline-flex;vertical-align:middle}
.chip.sh{padding:4px 10px 4px 5px;display:inline-flex;align-items:center;gap:4px}
.chip.sh .badge.st-red,.chip.sh .badge.st-blue,.chip.sh .badge.st-gray{font-size:15px}
.chip.sh.on{background:var(--bg);color:var(--txt);border:2px solid var(--brand)}
.colors{display:flex;gap:8px}
.cdot{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1.5px var(--tap);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg2)}
.cdot.on{box-shadow:0 0 0 3px var(--txt)}
.inp:focus,textarea:focus{outline:0;box-shadow:0 0 0 3px rgba(61,109,242,.25)}
input[type=checkbox]{accent-color:var(--tap)}
#payLine{margin:6px 12px 4px;border:1.5px solid var(--tap) !important;border-radius:10px;align-items:center;white-space:nowrap}
#payLine b{font-size:16px}
#extraLine{margin:0 12px 8px;border:1.5px solid var(--tap);border-radius:10px;background:none;padding:7px 10px;display:flex;align-items:center;gap:5px;
  font-size:12.5px;letter-spacing:-.3px;color:var(--sub);white-space:nowrap;overflow-x:auto;scrollbar-width:none;text-align:left}
#extraLine::-webkit-scrollbar{display:none}
#extraLine .amt{font-weight:700;color:var(--sat)}
#extraLine .w{color:var(--sat);font-weight:600} #extraLine .r{color:var(--red);font-weight:600}
#extraLine .sep{color:var(--line)}
details summary{border:1.5px solid var(--tap);border-radius:10px;padding:10px 12px !important;margin:8px 0}
.entry{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.entry .eh{display:flex;align-items:center;gap:6px;font-weight:700}
.entry .eh .m{font-size:12px;font-weight:600;color:var(--sub)}
.entry .eh .sp{flex:1}
.hint{font-size:12px;color:var(--sub);margin:2px 0 8px;line-height:1.5}

/* 아래에서 올라오는 창 */
/* 아래에서 올라오는 창: 올라올 때 240ms, 내려갈 때는 더 빨리 200ms */
#mask{position:fixed;inset:0;background:var(--mask);z-index:10;opacity:0;pointer-events:none;transition:opacity 200ms ease}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:18px 18px 0 0;z-index:11;display:flex;flex-direction:column;box-shadow:0 -4px 24px var(--shadow);
  transform:translateY(100%);visibility:hidden;transition:transform 200ms var(--ease-out),visibility 0s linear 200ms}
#sheet.on{transform:translateY(0);visibility:visible;transition:transform 240ms var(--ease-drawer),visibility 0s}
#sheet.drag{transition:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
#sheet .sh{touch-action:none}

/* 쫀득한 누름: 누르는 동안 쑥 들어가고(90ms), 떼면 살짝 튕기며 돌아옴 (JS 의 squish) */
button,.cell,.cdot,summary,select{transition:transform 220ms var(--ease-out)}
.pressing{transform:scale(0.92) !important;transition:transform 90ms var(--ease-out) !important}
.cell.pressing{transform:scale(0.95) !important}
nav button.pressing svg{transform:translateY(1px)}
@media (prefers-reduced-motion: reduce){
  #sheet,#sheet.on{transition:visibility 0s,opacity 150ms ease}
  #sheet{transform:none;opacity:0} #sheet.on{opacity:1}
  .pressing,.cell.pressing{transform:none !important}
  #toast{transition:opacity 150ms ease !important}
}
#sheet .sh{display:flex;align-items:center;padding:6px 16px 6px}
#sheet .sh .t{font-size:20px;font-weight:700;flex:1}
#sheet .scroll{padding-bottom:16px}
#sheet .shfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
#sheet .shfoot .btn{flex:1;padding:13px 0;font-size:16px}
#sheet .shfoot .btn.pri{flex:2}
/* 처음 설정 창 */
.ob{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.ob.on{display:block}
.obin{max-width:460px;margin:0 auto}
.obt{font-size:26px;font-weight:700;margin:10px 0 6px}
.btn:disabled{opacity:.45}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,8px) scale(0.97);opacity:0;pointer-events:none;background:rgba(30,30,30,.9);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;white-space:nowrap;
  transition:opacity 150ms ease,transform 150ms var(--ease-out)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1);transition:opacity 200ms ease,transform 200ms var(--ease-out)}
</style>
</head>
<body>
<div id="app">

  <!-- 3 설정 -->

  </section>

  </section>

  <nav>

      teamOffsets:{A:1, B:0, C:-1, D:-2},

/* 법정 공휴일 (대체공휴일 포함). 달라지면 날짜를 눌러 「쉬는 날」로 직접 바꿀 수 있습니다. */
const HOLIDAYS = {
  '2025-01-01':'신정','2025-01-27':'임시공휴일','2025-01-28':'설날','2025-01-29':'설날','2025-01-30':'설날',

  '2025-06-03':'대통령선거','2025-06-06':'현충일','2025-08-15':'광복절','2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석','2025-10-07':'추석','2025-10-08':'대체공휴일','2025-10-09':'한글날','2025-12-25':'성탄절',
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일',
  '2026-06-03':'지방선거','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일',
  '2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석','2026-10-03':'개천절','2026-10-05':'대체공휴일',
  '2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체공휴일',
  '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일',
  '2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석',
  '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일',
  '2027-12-25':'성탄절','2027-12-27':'대체공휴일',
  '2028-01-01':'신정','2028-01-25':'설날','2028-01-26':'설날','2028-01-27':'설날','2028-03-01':'삼일절',
  '2028-04-12':'국회의원선거','2028-05-02':'부처님오신날','2028-05-05':'어린이날','2028-06-06':'현충일',
  '2028-08-15':'광복절','2028-10-02':'추석','2028-10-03':'추석·개천절','2028-10-04':'추석','2028-10-05':'대체공휴일',
  '2028-10-09':'한글날','2028-12-25':'성탄절',
};
/* 기념일 (쉬는 날 아님) */
const MEMORIAL = {'11-09':'소방의날'};

/* ───────── 저장 ───────── */
let S;
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  const o = raw ? safeParse(raw) : null;
  S = merge(defaults(), o);
  // 처음 설정 표시가 없는 예전 기록: 실제로 넣은 근태·메모·연차가 있을 때만 「이미 쓰던 사람」으로 봄
  // (링크만 한 번 열어 본 기록은 예전 기본값이 섞여 있으므로 처음 설정을 다시 묻고 통상임금을 비움)
  if(window.PERSONAL && window.PERSONAL.fixedPay && !S.settings.fixedPay)
    S.settings.fixedPay = window.PERSONAL.fixedPay.map(f => [f[0], f[1]]);
  if(o && o.onboarded == null){
    const used = Object.keys(o.days || {}).length || Object.keys(o.monthMemo || {}).length || (o.settings && o.settings.leave);
    S.onboarded = !!used;
    if(!used) S.settings.wage = 0;
  }
}
function safeParse(t){ try{ return JSON.parse(t); }catch(e){ return null; } }
function merge(d, o){
  if(!o || typeof o !== 'object') return d;
  const r = Object.assign({}, d, o);
  const old = o.settings && !o.settings.ver;
  r.settings = Object.assign({}, d.settings, o.settings || {});
  if(old){ // 1.0 기본값 그대로면 기관 근무시간으로 바꿈
    for(const sh of r.settings.shifts){
      if(sh.name === '주' && sh.start === '09:00' && sh.end === '18:00' && !sh.rest) Object.assign(sh, {end:'18:40', rest:1});
      if(sh.name === '야' && sh.start === '18:00' && sh.end === '09:00' && !sh.rest) Object.assign(sh, {start:'18:10', end:'09:10', rest:3, nightFix:'6:00'});
    }
    r.settings.ver = 2;
  }
  if(r.settings.ver < 3){ // 1.2 이전: 추가근무를 「주간과 같은 시간」으로
    for(const t of r.settings.types) if(t.mode === 'add' && t.like == null && t.start === '09:00' && t.end === '18:00') Object.assign(t, {like:'주', end:'18:40'});
    for(const k in (o.days || {})) for(const e of (o.days[k].entries || [])){
      const t = r.settings.types.find(x => x.id === e.type);
      if(t && t.mode === 'add' && e.like == null && e.start === '09:00' && e.end === '18:00') e.like = '주';
    }
    r.settings.ver = 3;
  }
  if(r.settings.ver < 4){ // 1.3 이전: 휴게를 실제 시각으로 (주 12:00~13:00, 야 04:00~07:00)
    for(const sh of r.settings.shifts){
      if(sh.restAt) continue;
      if(sh.name === '주' && sh.start === '09:00' && sh.end === '18:40' && sh.rest === 1) sh.restAt = '12:00~13:00';
      if(sh.name === '야' && sh.start === '18:10' && sh.end === '09:10' && sh.rest === 3){ sh.restAt = '04:00~07:00'; if(sh.nightFix === '6:00') sh.nightFix = ''; }
    }
    r.settings.ver = 4;
  }
  if(r.settings.ver < 5) r.settings.ver = 5; // (예전 1회용 고침, 이미 끝남)
  if(r.settings.ver < 6){ // 연차·공가·교육·근무협조·병가·청원휴가 = 쉬는 날(근무 대신)
    for(const t of r.settings.types)
      if(['근무협조','교육'].includes(t.name) && t.mode !== 'replace') Object.assign(t, {mode:'replace', credit:8});
    if(!r.settings.types.some(t => t.name === '청원휴가')){
      const at = r.settings.types.findIndex(t => t.name === '출장');
      r.settings.types.splice(at < 0 ? r.settings.types.length : at, 0, {id:'t9', name:'청원휴가', mode:'replace', start:'', end:'', credit:8});
    }
    r.settings.ver = 6;
  }
  if(r.settings.ver < 7){ // 야간 전반차 야간 인정: 6시간 − (22:00~01:40 출근) = 2시간 20분
    const am = r.settings.partTable && r.settings.partTable['야'] && r.settings.partTable['야'].am;
    if(am && am.night === '2:50') am.night = '2:20';
    r.settings.ver = 7;
  }
  if(r.settings.ver < 9){ // 회사 시급 = 통상임금 ÷ 209 (2026-10 급여명세서로 확인)
    if(Number(r.settings.wageDiv) === 214) r.settings.wageDiv = 209;
  }
  if(r.settings.ver < 8){ // 야간 후반차 야간 인정: 22:00~01:40 퇴근 = 3시간 40분
    const pm = r.settings.partTable && r.settings.partTable['야'] && r.settings.partTable['야'].pm;
    if(pm && pm.night === '2:10') pm.night = '3:40';
    r.settings.ver = 8;
  }
  if(r.settings.ver < 9) r.settings.ver = 9;
  if(r.settings.ver < 10){ // 기타(기록만)에 「산업안전교육」 추가
    if(!r.settings.types.some(t => t.name === '산업안전교육'))
      r.settings.types.push({id:'t10', name:'산업안전교육', mode:'none', start:'', end:'', credit:0});
    r.settings.ver = 10;
  }
  r.days = o.days || {}; r.monthMemo = o.monthMemo || {};
  return r;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 150);
}
function saveNow(){
  let data = S;
  if(editK){ // 날짜 창에서 고치는 중이면 그 날짜는 「저장」 전 원래 값으로 씀
    data = Object.assign({}, S, {days:Object.assign({}, S.days)});
    if(draftOrig) data.days[editK] = draftOrig; else delete data.days[editK];
  }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e){ toast('저장하지 못했습니다'); }
}

/* ───────── 날짜 도구 ───────── */
const pad = n => String(n).padStart(2,'0');
const key = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const dnum = k => { const [y,m,d] = k.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const fromNum = n => { const t = new Date(n*864e5); return key(t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()); };
const dow = k => new Date(dnum(k)*864e5).getUTCDay();
const DOW = ['일','월','화','수','목','금','토'];
function todayKey(){ const t = new Date(); return key(t.getFullYear(), t.getMonth()+1, t.getDate()); }
const mins = t => { if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmtH = m => String(Math.round(m/0.6)/100);
/* '2:50' '6' '1.5' → 분 */
function hm(v){
  if(v == null || String(v).trim() === '') return null;
  const t = String(v).trim();
  if(t.includes(':')){ const [h, m] = t.split(':'); return (Number(h)||0)*60 + (Number(m)||0); }
  return Math.round((Number(t)||0)*60);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────── 근무 계산 ───────── */
function shiftDef(name){ return S.settings.shifts.find(s => s.name === name); }
function typeDef(id){ return S.settings.types.find(t => t.id === id) || {id, name:'(지운 종류)', mode:'none', credit:0}; }
const TEAMS = ['A','B','C','D'];
function teamOffset(t){ return Number((S.settings.teamOffsets || {})[t]) || 0; }
function patternShift(k, team){
  const p = [...S.settings.pattern];
  if(!p.length) return '';
  let a = p.indexOf(S.settings.anchorShift); if(a < 0) a = 0;
  const off = teamOffset(team || S.settings.team);
  const i = ((dnum(k) - off - dnum(S.settings.anchorDate) + a) % p.length + p.length) % p.length;
  return p[i];
}
function dayData(k){ return S.days[k]; }
function effShift(k){
  const d = dayData(k);
  if(d && d.shift != null) return d.shift; // '' = 근무 없음
  return patternShift(k);
}
function holidayName(k){
  const d = dayData(k);
  if(d && d.hol === false) return null;
  if(d && d.hol === true) return d.holName || '휴일';
  return HOLIDAYS[k] || null;
}
function isRestDay(k){
  const w = dow(k);
  return w === 0 || (w === 6 && S.settings.satIsHoliday) || !!holidayName(k);
}
function overlap(a,b,c,d){ return Math.max(0, Math.min(b,d) - Math.max(a,c)); }
/* 시작~끝(분)을 그 날짜 기준 구간으로. 끝이 시작보다 이르면 다음날. 같으면 24시간 */
function interval(k, start, end){
  const s = mins(start), e = mins(end);
  if(s == null || e == null) return null;
  let dur = (e - s + 1440) % 1440; if(dur === 0) dur = 1440;
  const a = dnum(k)*1440 + s;
  return [a, a + dur];

/* '04:00~07:00, 12:00~13:00' → [[시작분, 끝분], ...] */
function parseRest(t){
  const out = [];
  for(const part of String(t || '').split(/[,，]/)){
    const m = /(\d{1,2}):(\d{2})\s*[~\-]\s*(\d{1,2}):(\d{2})/.exec(part);
    if(m) out.push([Number(m[1])*60 + Number(m[2]), Number(m[3])*60 + Number(m[4])]);
  }
  return out;
}
/* 구간 [a,b) 의 근무·야간·휴일 시간(분).
   restAt(휴게 시각)이 있으면 그 시각을 실제로 빼고, 없으면 휴게 시간 수(rest)를 고르게 뺌 */
function measure(k, iv, rest, nightRest, restAt){
  if(!iv) return {work:0, night:0, hol:0};
  const [a,b] = iv, dur = b - a;
  const ns = mins(S.settings.nightStart), ne = mins(S.settings.nightEnd);
  let nlen = (ne - ns + 1440) % 1440; if(nlen === 0) nlen = 1440;
  const base = dnum(k);
  const wins = [];
  for(const [rs, re] of parseRest(restAt)){
    const len = (re - rs + 1440) % 1440 || 1440;
    for(let i = base - 1; i <= base + 2; i++){
      const x = Math.max(a, i*1440 + rs), y = Math.min(b, i*1440 + rs + len);
      if(y > x) wins.push([x, y]);
    }
  }
  const cut = (c, d) => wins.reduce((t, [x, y]) => t + overlap(c, d, x, y), 0);
  let night = 0, hol = 0;
  for(let i = base - 1; i <= base + 2; i++){
    const n0 = i*1440 + ns, n1 = n0 + nlen;
    night += overlap(a, b, n0, n1) - cut(Math.max(a, n0), Math.min(b, n1));
    if(isRestDay(fromNum(i))){ const h0 = i*1440, h1 = h0 + 1440; hol += overlap(a, b, h0, h1) - cut(Math.max(a, h0), Math.min(b, h1)); }
  }
  if(wins.length) return {work:dur - cut(a, b), night:Math.max(0, night), hol:Math.max(0, hol)};
  const r = Math.min(dur, (rest||0)*60);
  const work = dur - r;
  night = Math.max(0, night - (nightRest||0)*60);

/* 하루 계산 결과 (분 단위) */
const partOf = e => (e.part && PARTS[e.part] && e.part !== 'full') ? e.part : 'full';
function partRow(sh, p){ const t = S.settings.partTable || {}; return t[sh] && t[sh][p]; }
/* 교대근무 하나의 시간. 「야간 인정」을 적어 두었으면 그 값을 씀 */
function shiftMeasure(k, def){
  const m = measure(k, interval(k, def.start, def.end), def.rest, def.nightRest, def.restAt);
  const fix = hm(def.nightFix);
  if(fix != null) m.night = fix;

/* 추가근무(휴일근무 등)의 근무 정의: 「주간과 같게」를 고르면 그 근무의 시각·휴게·야간 인정을 그대로 씀 */
function entryDef(e){
  const like = e.like ? shiftDef(e.like) : null;
  if(like && like.start && like.end) return like;
  return {start:e.start, end:e.end, rest:Number(e.rest) || 0, nightRest:0, nightFix:''};
}
/* 분할연차를 쓴 날 실제로 일한 구간 (「01:40 출근」·「14:20 퇴근」에서 읽음) */
function partSeg(k, def, row){
  const tm = /(\d{1,2}):(\d{2})\s*(출근|퇴근)/.exec((row && row.note) || '');
  const iv = interval(k, def.start, def.end);
  if(!tm || !iv) return null;
  let at = dnum(k)*1440 + Number(tm[1])*60 + Number(tm[2]);

  return tm[3] === '출근' ? [at, iv[1]] : [iv[0], at];
}
/* 그 날 일하는 덩어리들 (시각 구간만). 앞뒤 날과 겹치는지 볼 때 씀 */
function dayBlocks(k){
  const d = dayData(k) || {};
  const sh = effShift(k), def = shiftDef(sh);
  const entries = d.entries || [];
  const reps = entries.filter(e => typeDef(e.type).mode === 'replace');
  const replaced = reps.some(e => partOf(e) === 'full');
  // 분할연차는 하루에 하나만 (중복신청 불가) → 첫 번째만 계산
  const partE = replaced ? null : (reps.find(e => partOf(e) !== 'full' && partRow(sh, partOf(e))) || null);
  const blocks = [];
  if(def && def.start && def.end && !replaced){
    let iv = interval(k, def.start, def.end);
    if(partE) iv = partSeg(k, def, partRow(sh, partOf(partE))) || iv;
    blocks.push({id:'s', a:iv[0], b:iv[1], entry:false});
  }
  entries.forEach((e, i) => {
    if(typeDef(e.type).mode !== 'add') return;
    const ed = entryDef(e), iv = interval(k, ed.start, ed.end);
    if(iv) blocks.push({id:'e' + i, a:iv[0], b:iv[1], entry:true});

  return {d, sh, def, entries, replaced, partE, blocks};

/* 연속 근무로 겹친 시간: 추가근무(휴일근무 등)에서 뺌 → 초과시간이 그만큼 줄어듦.
   둘 다 교대근무거나 둘 다 추가근무면 먼저 시작한 쪽에서 뺌
   예) 휴일근무 주간 09:00~18:40 + 같은 날 야간 18:10 출근 → 휴일근무에서 30분 (8.17시간)
       야간 ~09:10 퇴근 + 다음날 휴일근무 주간 09:00 출근 → 휴일근무에서 10분 */
function overlapSegs(k, info, blk){
  const segs = [];
  const n = dnum(k);
  for(let j = n - 1; j <= n + 1; j++){
    const bs = j === n ? info.blocks : dayBlocks(fromNum(j)).blocks;
    for(const o of bs){
      if(j === n && o.id === blk.id) continue;
      const mineFirst = blk.entry !== o.entry ? blk.entry : (blk.a < o.a || (blk.a === o.a && blk.id < o.id));
      if(!mineFirst) continue;
      const a = Math.max(blk.a, o.a), b = Math.min(blk.b, o.b);
      if(b > a) segs.push([a, b]);
    }
  }
  return segs;
}
function minusOverlap(k, m, segs){
  let loss = 0;
  for(const sg of segs){
    const x = measure(k, sg, 0, 0);
    loss += x.work; m.work -= x.work; m.night -= x.night; m.hol -= x.hol;
  }
  m.work = Math.max(0, m.work); m.night = Math.max(0, m.night); m.hol = Math.max(0, m.hol);
  m.loss = loss;

}
function dayCalc(k){
  const info = dayBlocks(k);
  const {sh, def, entries, replaced, partE} = info;
  const r = {shift:sh, worked:false, work:0, night:0, hol:0, credit:0, loss:0, replaced, part:partE ? partOf(partE) : null, items:[]};
  if(def && def.start && def.end && !replaced){
    const m = shiftMeasure(k, def);
    if(partE){
      const row = partRow(sh, partOf(partE)), w = hm(row.work) || 0;
      const seg = partSeg(k, def, row);
      if(seg){
        const sm = measure(k, seg, 0, 0, def.restAt), span = sm.work || (seg[1] - seg[0]);
        m.hol = span > 0 ? Math.round(sm.hol * Math.min(1, w / span)) : 0;
      } else m.hol = m.work ? Math.round(m.hol * w / m.work) : 0;
      m.work = w; m.night = hm(row.night) || 0;
    }
    minusOverlap(k, m, overlapSegs(k, info, info.blocks.find(b => b.id === 's')));
    r.work += m.work; r.night += m.night; r.hol += m.hol; r.loss += m.loss; r.worked = true;
  }
  entries.forEach((e, i) => {
    const t = typeDef(e.type);
    const it = {type:e.type, name:t.name, mode:t.mode, part:null, work:0, night:0, hol:0, credit:0, loss:0};
    if(t.mode === 'add'){
      const ed = entryDef(e);
      const m = measure(k, interval(k, ed.start, ed.end), ed.rest, ed.nightRest, ed.restAt);
      const fix = hm(ed.nightFix); if(fix != null) m.night = fix;
      const blk = info.blocks.find(b => b.id === 'e' + i);
      if(blk) minusOverlap(k, m, overlapSegs(k, info, blk));
      it.work = m.work; it.night = m.night; it.hol = m.hol; it.loss = m.loss || 0;
      r.work += m.work; r.night += m.night; r.hol += m.hol; r.loss += it.loss;
    } else if(t.mode === 'replace'){
      const p = partOf(e);
      if(p === 'full') it.credit = (Number(e.credit != null ? e.credit : t.credit) || 0) * 60;
      else { it.part = p; it.name += '(' + PARTS[p] + ')'; if(e === partE) it.credit = hm(partRow(sh, p).credit) || 0; }
      r.credit += it.credit;
    } else if(e.start && e.end){
      const m = measure(k, interval(k, e.start, e.end), 0, 0);

  });

}
function monthCalc(y, m){
  const last = new Date(y, m, 0).getDate();
  const res = {work:0, night:0, hol:0, credit:0, extra:0, otOnly:0, hol1:0, hol2:0, extraNight:0, weekdays:0, shiftCount:{}, types:{}, rows:[]};
  for(let d = 1; d <= last; d++){
    const k = key(y,m,d);
    const w = dow(k);
    if(w >= 1 && w <= 5 && !holidayName(k)) res.weekdays++;
    const c = dayCalc(k);
    res.work += c.work; res.night += c.night; res.hol += c.hol; res.credit += c.credit;
    if(c.shift && c.worked) res.shiftCount[c.shift] = (res.shiftCount[c.shift]||0) + 1;
    for(const it of c.items){
      const t = res.types[it.type] || (res.types[it.type] = {name:typeDef(it.type).name, mode:it.mode, n:0, min:0});
      t.n++; t.min += it.mode === 'replace' ? it.credit : it.work;
      if(it.mode === 'add'){
        res.extra += it.work; res.extraNight += it.night;
        // 개인용: 휴일근무수당은 원래 「휴」인 날만. 「비」 등 다른 날 휴일근무는 시간외로 (9월 명세서 검산)
        const holDay = c.shift === RULES.holidayShift;
        if(it.name.indexOf('휴일근무') >= 0 && holDay){
          const base = RULES.holidayBaseHours * 60;
          res.hol1 += Math.min(base, it.work); res.hol2 += Math.max(0, it.work - base);
        } else if(it.name.indexOf('지정근무') >= 0){
          // 지정근무: 주간 하루(8.67시간)를 넘는 시간만 초과 (야간 12시간 → 초과 3.33시간, 야간수당 6시간은 그대로)
          const sd = shiftDef(RULES.designatedBase);
          const base = sd && sd.start && sd.end ? shiftMeasure(k, sd).work : 0;
          res.otOnly += Math.max(0, it.work - base);
        } else res.otOnly += it.work;
      }
    }
    if(c.work || c.credit || c.items.length) res.rows.push({k, c});
  }
  res.base = res.weekdays * (Number(S.settings.baseHours)||0) * 60;
  res.overBase = res.work + res.credit - res.base;
  res.over = S.settings.otMethod === 'base' ? res.overBase : res.extra;
  if(S.settings.otMethod !== 'base') res.over = res.otOnly;   // 명세서처럼 휴일근무는 시간외와 따로
  return res;
}
const won = n => Math.floor(n).toLocaleString('ko-KR') + '원';
/* 회사 급여 규칙 (2026-10 급여명세서 = 9월 근무분으로 검산)
   · 회사 시급 = 통상임금 ÷ 209 (정수), 단가 = 시급 × 배율 반올림, 금액 = 단가 × 시간(소수 둘째 자리)의 10원 아래 버림
   · 휴일근무수당은 원래 「휴」인 날만: 8시간까지 1.5배(휴일1), 넘는 시간 2배(휴일2). 「비」 날 휴일근무는 시간외
   · 지정근무 초과 = 일한 시간 − 주간 하루(8.67시간)  예) 야간 12시간 → 초과 3.33시간 + 야간 6시간
   · 법정차액 = (법정 시급 − 회사 시급) × 배율. 법정 시급을 적은 사람만. 2027년부터 각 수당에 합쳐짐 */
const RULES = {holidayShift:'휴', holidayBaseHours:8, holidayMult2:2, designatedBase:'주', mergeYear:2027};
function payCalc(r, y){
  if(y == null) y = curY;
  const P = window.PERSONAL || {}, st = S.settings;
  const hr = Math.floor((Number(st.wage) || 0) / (Number(st.wageDiv) || 209));
  const lg = Number(st.legalHourly) || Number(P.legalHourly) || 0;
  const merged = !!lg && y >= RULES.mergeYear;
  const H = m => Math.round(m / 60 * 100) / 100;
  const amt = (h, mult, hours) => Math.floor(Math.round(h * mult) * hours / 10) * 10;
  const ot = Number(st.otRate) || 1.5, nt = Number(st.nightRate) || 0.5;
  const items = [['시간외근무수당', ot, H(r.otOnly)], ['야간근무수당', nt, H(r.night)], ['휴일근무수당1', ot, H(r.hol1)], ['휴일근무수당2', RULES.holidayMult2, H(r.hol2)]]
    .map(([name, mult, hours]) => { const co = amt(hr, mult, hours);
      return {name, mult, hours, co, lg:!lg ? co : merged ? amt(lg, mult, hours) : co + amt(lg - hr, mult, hours)}; });
  const coSum = items.reduce((a, i) => a + i.co, 0), lgSum = items.reduce((a, i) => a + i.lg, 0);
  const fixedList = (st.fixedPay || []).filter(f => Number(f[1])), fixed = fixedList.reduce((a, f) => a + Number(f[1]), 0);
  const allow = merged ? lgSum : coSum, diff = merged ? 0 : lgSum - coSum;
  return {hourly:hr, legal:lg, merged, items, fixedList, fixed, allow, diff, total:allow + diff, grand:fixed + allow + diff, amt};
}
const LEAVE_AMT = {full:1, am:.5, pm:.5, q1:.25, q4:.25};
const fmtN = n => String(Math.round(n * 100) / 100);
/* from 날짜(포함)부터 그 해 끝까지 쓴 연차 개수와 목록 */
function leaveSince(from){
  const ids = S.settings.types.filter(t => t.name.indexOf('연차') >= 0).map(t => t.id);
  const y = from.slice(0, 4), list = [];
  let n = 0;
  for(const k of Object.keys(S.days).sort()){
    if(k < from || !k.startsWith(y + '-')) continue;
    for(const e of (S.days[k].entries || [])) if(ids.includes(e.type)){
      const a = LEAVE_AMT[partOf(e)]; n += a; list.push({k, part:partOf(e), a});
    }
  }
  return {n, list};
}
/* 올해 남은 연차. 「내 정보」에 적은 개수에서 그 날 이후 쓴 연차를 뺌 */
function leaveLeft(){
  const lv = S.settings.leave, y = String(new Date().getFullYear());
  if(!lv || lv.remain == null || String(lv.year) !== y) return null;
  const u = leaveSince(lv.asOf);
  return {left:Number(lv.remain) - u.n, used:u.n, list:u.list, asOf:lv.asOf, remain:Number(lv.remain)};
}
/* 그 해 근태 개수: 일하는 날은 종류×주/야 마다 (1개씩), 쉬는 날은 종일 1·반차 0.5·1/4 0.25 */
function yearTally(y){
  const months = [];
  for(let m = 1; m <= 12; m++) months.push({});
  for(const k of Object.keys(S.days)){
    if(!k.startsWith(y + '-')) continue;
    const d = S.days[k]; if(!d.entries || !d.entries.length) continue;
    const mo = months[Number(k.slice(5, 7)) - 1], c = dayCalc(k);
    d.entries.forEach((e, i) => {
      const t = typeDef(e.type);
      if(t.mode === 'add'){
        const kk = 'w|' + t.id + '|' + (e.like || '');
        const o = mo[kk] || (mo[kk] = {n:0, min:0}); o.n++; o.min += (c.items[i] || {}).work || 0;
      } else if(t.mode === 'replace'){
        const kk = 'r|' + t.id;
        const o = mo[kk] || (mo[kk] = {n:0, min:0}); o.n += LEAVE_AMT[partOf(e)];
      }
    });
  }
  return months;
}
function leaveUsed(y){
  const ids = S.settings.types.filter(t => t.name.indexOf('연차') >= 0).map(t => t.id);
  let n = 0;
  for(const k in S.days){
    if(!k.startsWith(y + '-')) continue;
    for(const e of (S.days[k].entries||[])) if(ids.includes(e.type)) n += {full:1, am:.5, pm:.5, q1:.25, q4:.25}[partOf(e)];
  }
  return n;

    case 'pick': {
      const t = typeDef(el.dataset.v), list = d.entries || (d.entries = []);
      const at = list.findIndex(e => e.type === t.id);
      if(at >= 0){ list.splice(at, 1); break; }
      if(t.mode === 'replace') d.entries = list.filter(e => typeDef(e.type).mode !== 'replace');
      d.entries.push({type:t.id, like:t.mode === 'add' ? (t.like || '') : undefined, start:t.start||'', end:t.end||'', rest:t.rest||0,
        credit:t.mode === 'replace' ? t.credit : undefined, note:''});
      break; }
    case 'part': d.entries[i].part = el.dataset.v; break;
    case 'like': {
      const e = d.entries[i]; e.like = el.dataset.v;
      if(!e.like && !e.start){ e.start = '09:00'; e.end = '18:40'; e.rest = 1; }
      break; }
    case 'erest': d.entries[i].rest = Number(el.value) || 0; break;
    case 'estart': d.entries[i].start = el.value; break;
    case 'eend': d.entries[i].end = el.value; break;
    case 'ecredit': d.entries[i].credit = el.value === '' ? 0 : Number(el.value); break;
    case 'enote': d.entries[i].note = el.value; dclean(k); save(); return; // 글자 칠 때는 다시 그리지 않음
    case 'color': d.color = el.dataset.v; break;
    case 'hol': {
      const builtin = !!HOLIDAYS[k];
      if(el.checked) d.hol = builtin ? undefined : true; else d.hol = builtin ? false : undefined;
      if(d.hol === undefined) delete d.hol;
      break; }
    case 'holname': d.holName = el.value; dclean(k); save(); return;
  }
  dclean(k); save();
  if((act === 'pick' || act === 'part' || act === 'del') && typeof leaveLeft === 'function'){
    const ll = leaveLeft();
    if(ll && (act !== 'pick' || typeDef(el.dataset.v).name.indexOf('연차') >= 0)) toast(`저장하면 남은 연차 ${fmtN(ll.left)}개`);
  }
  if(act === 'estart' || act === 'eend' || act === 'ecredit' || act === 'erest'){ if(ev.type === 'change') renderDay(); return; }
  renderDay();
}

/* 근무한 달 → 다음 달 급여 예상 (고정급은 개인용 앱에만, 법정차액은 법정 시급을 적은 사람만) */
function payCards(r, pay){
  const st = S.settings;
  const row = (l, v, sub) => `<div class="kv"><span>${l}${sub ? ` <span class="s">${sub}</span>` : ''}</span><span class="v">${won(v)}</span></div>`;
  let h = `<div class="card" style="margin-top:8px">
    <div class="kv"><span>${curM}월 근무분 → <b>${curM % 12 + 1}월 급여</b> ${pay.fixed ? '' : '수당 '}예상 <span class="s">세금 떼기 전</span></span></div>
    <div style="font-size:30px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;margin:2px 0 8px">${won(pay.grand)}</div>
    ${pay.fixed ? row('고정급', pay.fixed, '매달 같음') : ''}${row(pay.fixed ? '수당' : '수당 합계', pay.allow, pay.merged ? '법정 시급 기준' : '회사 시급 기준')}${pay.legal && !pay.merged ? row('법정차액', pay.diff, `~${RULES.mergeYear - 1}년 따로 지급`) : ''}</div>`;
  h += `<h3>수당</h3><div class="card">`;
  for(const it of pay.items){
    if(!it.hours && it.name.indexOf('2') >= 0) continue;
    const unit = Math.round((pay.merged ? pay.legal : pay.hourly) * it.mult);
    h += row(it.name, pay.merged ? it.lg : it.co, `${won(unit)} × ${it.hours}시간`);
    if(pay.legal && !pay.merged && it.lg - it.co) h += `<div class="kv" style="padding-top:0"><span class="s" style="padding-left:12px">└ ${it.name.replace('근무수당', '수당')}_법정차액</span><span class="s">${won(it.lg - it.co)}</span></div>`;
  }
  h += `<div class="note">회사 시급 ${won(pay.hourly)} = 통상임금 ${won(st.wage)} ÷ ${st.wageDiv}${pay.legal ? ` · 법정 시급 ${won(pay.legal)}` : ''}<br>
    휴일근무수당은 「${RULES.holidayShift}」인 날만: ${RULES.holidayBaseHours}시간까지 1.5배(휴일1), 넘는 시간 2배(휴일2) · 「비」 날 휴일근무는 시간외<br>
    지정근무는 8.67시간 넘는 만큼만 초과 · 금액은 10원 아래 버림</div></div>`;
  if(pay.fixed) h += `<h3>고정급</h3><div class="card">${pay.fixedList.map(f => row(f[0], f[1])).join('')}</div>`;
  // 휴일근무 하루 단가 (법정차액 포함)
  const unitCards = st.shifts.filter(x => x.start && x.end).map(sd => {
    const m = shiftMeasure(todayKey(), sd), hrs = Math.round(m.work / 60 * 100) / 100, nh = Math.round(m.night / 60 * 100) / 100;
    const b = RULES.holidayBaseHours, h1 = Math.min(b, hrs), h2 = Math.round((hrs - h1) * 100) / 100;
    const ot = Number(st.otRate) || 1.5, ntr = Number(st.nightRate) || 0.5;
    const sum = hr => pay.amt(hr, ot, h1) + pay.amt(hr, RULES.holidayMult2, h2) + pay.amt(hr, ntr, nh);
    return row(`${badgeHTML(sd.name).replace('class="badge', 'style="width:24px;height:24px;font-size:13px;display:inline-flex;vertical-align:middle;margin-right:6px" class="badge')}휴일근무 ${esc(sd.name)}간`,
      sum(pay.legal || pay.hourly), `${h1}h×1.5${h2 ? ` + ${h2}h×2` : ''}${nh ? ` + 야간 ${nh}h×0.5` : ''}`);
  }).join('');
  h += `<div class="card"><div class="kv"><span>휴일근무 하루 단가 <span class="s">「휴」 날 기준${pay.legal ? ' · 법정차액 포함' : ''}</span></span></div>${unitCards}</div>`;
  return h;
}

  h += `<details><summary>날짜별로 보기</summary><table class="days"><tr><th>날짜</th><th>근무</th><th>시간</th><th>야간</th><th>휴일</th></tr>`;

function renderSum(){
  $('stitle').textContent = `${curY}년`;
  const months = yearTally(curY), st = S.settings;
  const MODES2 = {m:'월별', q:'분기별', h:'반기별', y:'1년'};
  let cols;
  if(sumMode === 'q') cols = [[1,3,'1분기','1~3월'],[4,6,'2분기','4~6월'],[7,9,'3분기','7~9월'],[10,12,'4분기','10~12월']];
  else if(sumMode === 'h') cols = [[1,6,'상반기','1~6월'],[7,12,'하반기','7~12월']];
  else if(sumMode === 'y') cols = [[1,12,`${curY}년`,'']];
  else { const m = sumPick || curM; cols = [[m,m,`${m}월`,'']]; }
  const total = sumMode === 'q' || sumMode === 'h';
  const sumOf = (kk, a, b) => { let n = 0, min = 0; for(let m = a; m <= b; m++){ const o = months[m-1][kk]; if(o){ n += o.n; min += o.min; } } return {n, min}; };
  const cell = (v, unit) => v ? `<td>${fmtN(v)}${unit}</td>` : `<td class="z">0</td>`;
  let h = `<div class="seg sm">${Object.entries(MODES2).map(([k, l]) => `<button data-sm="${k}" class="${sumMode === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if(sumMode === 'm'){
    h += `<div class="chips2" style="margin-bottom:6px">`;
    for(let m = 1; m <= 12; m++) h += `<button class="chip ${(sumPick || curM) === m ? 'on' : ''}" data-pm="${m}" style="padding:6px 0;width:calc((100% - 30px) / 6);text-align:center">${m}월</button>`;
    h += `</div>`;
  }
  h += `<div class="card" style="padding:8px 12px"><table class="sum"><tr><th></th>${cols.map(c => `<th>${c[2]}${c[3] ? `<br><span style="font-weight:500">${c[3]}</span>` : ''}</th>`).join('')}${total ? '<th>합계</th>' : ''}</tr>`;
  // 일하는 날
  const work = st.types.filter(t => t.mode === 'add'), likes = st.shifts.filter(x => x.start && x.end).map(x => x.name);
  const anyDirect = work.some(t => months.some(mo => mo['w|' + t.id + '|']));
  h += `<tr class="g work"><td colspan="${cols.length + 2}">일하는 날</td></tr>`;
  const wTot = cols.map(() => ({n:0, min:0})), wAll = {n:0, min:0};
  for(const t of work) for(const lk of likes.concat(anyDirect ? [''] : [])){
    const kk = 'w|' + t.id + '|' + lk;
    const vals = cols.map(c => sumOf(kk, c[0], c[1]));
    vals.forEach((v, i) => { wTot[i].n += v.n; wTot[i].min += v.min; });
    const all = sumOf(kk, 1, 12); wAll.n += all.n; wAll.min += all.min;
    h += `<tr><td>${lk ? badgeHTML(lk).replace('class="badge', 'style="width:20px;height:20px;font-size:11px;display:inline-flex;vertical-align:middle;margin-right:4px" class="badge') : ''}${esc(t.name)}${lk ? '' : ' (직접)'}</td>${vals.map(v => cell(v.n, '회')).join('')}${total ? cell(all.n, '회') : ''}</tr>`;
  }
  h += `<tr class="tot"><td>합계</td>${wTot.map(v => cell(v.n, '회')).join('')}${total ? cell(wAll.n, '회') : ''}</tr>`;
  h += `<tr><td style="color:var(--sub)">일한 시간</td>${wTot.map(v => cell(Number(fmtH(v.min)), 'h')).join('')}${total ? cell(Number(fmtH(wAll.min)), 'h') : ''}</tr>`;
  // 쉬는 날
  const ORDER = ['연차','공가','교육','근무협조','병가','청원휴가'];
  const rank = t => { const i = ORDER.indexOf(t.name); return i < 0 ? 99 : i; };
  const rest = st.types.filter(t => t.mode === 'replace').sort((x, y) => rank(x) - rank(y));
  h += `<tr class="g rest"><td colspan="${cols.length + 2}">쉬는 날 <span style="font-weight:500;font-size:12px;color:var(--sub)">종일 1 · 반차 0.5 · 1/4 0.25</span></td></tr>`;
  const rTot = cols.map(() => 0); let rAll = 0;
  for(const t of rest){
    const vals = cols.map(c => sumOf('r|' + t.id, c[0], c[1]).n), all = sumOf('r|' + t.id, 1, 12).n;
    vals.forEach((v, i) => rTot[i] += v); rAll += all;
    h += `<tr><td>${esc(t.name)}</td>${vals.map(v => cell(v, '일')).join('')}${total ? cell(all, '일') : ''}</tr>`;
  }
  h += `<tr class="tot"><td>합계</td>${rTot.map(v => cell(v, '일')).join('')}${total ? cell(rAll, '일') : ''}</tr>`;
  h += `</table></div>`;
  h += `<div class="note">주·야는 시간이 달라도 1회로 같게 셉니다. ‹ › 로 해를 바꿉니다. 저장한 근태만 셉니다.</div>`;
  $('statBody').innerHTML = h;
}

function onSet(ev){
  const el = ev.target, st = S.settings;
  if(el.dataset.off){ st.teamOffsets = Object.assign({}, st.teamOffsets, {[el.dataset.off]: Number(el.value) || 0}); save(); renderPreview(); return; }
  if(el.dataset.set){
    const f = el.dataset.set;
    if(el.type === 'checkbox') st[f] = el.checked;
    else if(el.type === 'number') st[f] = el.value === '' ? 0 : Number(el.value);
    else st[f] = el.value;
    if(f === 'pattern'){
      st.pattern = el.value.replace(/[\s,·\/]/g, '');
      if(ev.type === 'change'){
        for(const c of new Set([...st.pattern])) if(!shiftDef(c)) st.shifts.push({name:c, style:'gray', start:'', end:'', rest:0, nightRest:0});
        if(![...st.pattern].includes(st.anchorShift)) st.anchorShift = [...st.pattern][0] || '';
        save(); renderSet(); return;
      }
    }
    save(); renderPreview();
    if(f === 'wage' || f === 'wageDiv'){ const e = $('hourly'); if(e) e.textContent = won((Number(st.wage)||0) / (Number(st.wageDiv)||214)); }
    return;
  }
  if(el.dataset.sh){
    const s = st.shifts[Number(el.dataset.i)], f = el.dataset.sh;
    if(f === 'name'){
      if(ev.type !== 'change') return;
      const old = s.name; s.name = el.value.trim().slice(0, 1);
      if(old && s.name && old !== s.name){
        st.pattern = st.pattern.split(old).join(s.name);
        if(st.anchorShift === old) st.anchorShift = s.name;
        if(st.partTable && st.partTable[old] && !st.partTable[s.name]){ st.partTable[s.name] = st.partTable[old]; delete st.partTable[old]; }
        for(const k in S.days) if(S.days[k].shift === old) S.days[k].shift = s.name;
      }
    } else if(f === 'rest' || f === 'nightRest') s[f] = Number(el.value) || 0;
    else if(f === 'nightFix') s.nightFix = el.value.trim();
    else if(f === 'restAt'){ s.restAt = el.value.trim(); save(); if(ev.type === 'change') renderSet(); return; }
    else s[f] = el.value;
    save(); if(ev.type === 'change') renderSet(); return;
  }
  if(el.dataset.pt){
    const [shn, pk, f] = el.dataset.pt.split('|');
    const row = st.partTable[shn][pk] || (st.partTable[shn][pk] = {});
    row[f] = el.value.trim(); save(); return;
  }
  if(el.dataset.ty){
    const t = st.types[Number(el.dataset.i)], f = el.dataset.ty;
    t[f] = f === 'credit' ? (Number(el.value) || 0) : el.value;
    save(); if((f === 'mode' || f === 'like') && ev.type === 'change') renderSet(); return;
  }
}

  if(el.id === 'addShift'){ st.shifts.push({name:'', style:'gray', start:'', end:'', rest:0, nightRest:0}); save(); renderSet(); }
  else if(el.dataset.shdel != null){
    const s = st.shifts[Number(el.dataset.shdel)];
    if(s.name && st.pattern.includes(s.name)){ toast('교대 순서에 들어 있어서 지울 수 없습니다'); return; }
    st.shifts.splice(Number(el.dataset.shdel), 1); save(); renderSet();
  }
  else if(el.id === 'addType'){ st.types.push({id:'t' + Date.now(), name:'새 근태', mode:'none', start:'09:00', end:'18:00', credit:0}); save(); renderSet(); }
  else if(el.dataset.tydel != null){
    const t = st.types[Number(el.dataset.tydel)];
    if(!confirm(`「${t.name}」 종류를 지울까요? 이미 넣은 기록은 「지운 종류」로 남습니다.`)) return;
    st.types.splice(Number(el.dataset.tydel), 1); save(); renderSet();
  }
  else if(el.id === 'ptReset'){ if(confirm('분할연차 기준표를 처음 값으로 되돌릴까요?')){ st.partTable = defaultPartTable(); save(); renderSet(); } }
  else if(el.id === 'exp') exportData();
  else if(el.id === 'imp'){ $('impBox').style.display = 'block'; }
  else if(el.id === 'impGo') importData($('impText').value);
  else if(el.id === 'reset'){
    if(confirm('모든 근무 기록과 설정을 지웁니다. 되돌릴 수 없습니다. 계속할까요?') && confirm('정말 지울까요?')){
      S = defaults(); saveNow(); renderSet(); renderCal(); toast('지웠습니다');
    }
  }
}
function exportData(){
  saveNow();
  const text = JSON.stringify({app:'근무달력', at:new Date().toISOString(), data:S});
  if(window.Android && Android.share){ Android.share(text, '근무달력 백업 ' + todayKey()); return; }
  // 아이폰 등: 공유 창(카톡·메모 등)으로, 안 되면 파일로 내려받기
  if(navigator.share){ navigator.share({title:'근무달력 백업 ' + todayKey(), text}).catch(() => {}); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = `근무달력_백업_${todayKey()}.json`; a.click();
}
function importData(text){
  const o = safeParse((text||'').trim());
  const data = o && (o.data || o);
  if(!data || !data.settings || !data.days){ toast('백업 내용이 아닙니다. 전체를 붙여넣었는지 확인하세요'); return; }
  if(!confirm('지금 기록을 이 백업으로 바꿉니다. 계속할까요?')) return;
  S = merge(defaults(), data); saveNow(); renderSet(); renderCal(); toast('가져왔습니다');
}

/* ───────── 공통 ───────── */
let page = 'cal';
function show(p){
  page = p;
  for(const s of document.querySelectorAll('.page')) s.classList.toggle('on', s.id === 'p-' + p);
  for(const b of document.querySelectorAll('nav button')) b.classList.toggle('on', b.dataset.p === p);
  if(p === 'cal') renderCal(); if(p === 'stat') renderStat(); if(p === 'set') renderSet(); if(p === 'me') renderMe();
}
let toastT;
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }
/* 안드로이드 뒤로 가기 */
window.__back = function(){
  if($('onboard').classList.contains('on')){ if(window.Android && Android.exit) Android.exit(); return; }
  if(editK){ closeSheet(); return; }
  if(page !== 'cal'){ show('cal'); return; }
  if(window.Android && Android.exit) Android.exit();
};

/* 누른 버튼이 다시 그려져도(같은 data-* 를 가진 새 버튼) 튕김이 이어지도록 찾아서 재생 */
const PRESS_SEL = 'button, .cell, .cdot, summary, select';
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function pressKey(el){
  if(el.id) return '#' + CSS.escape(el.id);
  let q = el.tagName.toLowerCase();
  for(const a of el.attributes) if(a.name.startsWith('data-')) q += `[${a.name}="${CSS.escape(a.value)}"]`;
  return q;
}
function squish(el){
  if(!el || reduceMotion() || !el.animate) return;
  const big = el.classList.contains('cell') ? 0.95 : 0.92;
  el.animate([
    {transform:`scale(${big})`},
    {transform:'scale(1.06)', offset:0.38},
    {transform:'scale(0.985)', offset:0.68},
    {transform:'scale(1.008)', offset:0.86},
    {transform:'scale(1)'}
  ], {duration:460, easing:'cubic-bezier(0.22, 1, 0.36, 1)'});
}
(() => {
  let cur = null, key = '', x0 = 0, y0 = 0;
  const clear = () => { if(cur) cur.classList.remove('pressing'); cur = null; };
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest(PRESS_SEL);
    if(!el || el.disabled) return;
    clear(); cur = el; key = pressKey(el); x0 = e.clientX; y0 = e.clientY;
    el.classList.add('pressing');
  }, {passive:true});
  document.addEventListener('pointermove', e => {
    if(cur && Math.hypot(e.clientX - x0, e.clientY - y0) > 12) clear(); // 끌거나 밀면 누름 취소
  }, {passive:true});
  document.addEventListener('pointerup', () => {
    if(!cur) return;
    const old = cur, k = key; clear();
    // click 처리(다시 그리기)가 끝난 다음 프레임에 튕김
    requestAnimationFrame(() => {
      let el = old.isConnected ? old : null;
      if(!el){ try{ el = document.querySelector(k); }catch(e){} }
      squish(el);
    });
  });
  document.addEventListener('pointercancel', clear);
})();
/* 화면 밝기: light / dark / auto(휴대폰 설정) */
function systemDark(){
  try{ if(window.Android && Android.isNight) return !!Android.isNight(); }catch(e){}
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const m = S.settings.theme || 'auto';
  const dark = m === 'dark' || (m === 'auto' && systemDark());
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try{ if(window.Android && Android.setDark) Android.setDark(dark); }catch(e){}
}
window.__themeChanged = () => { applyTheme(); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme()); }catch(e){}
function showOnboard(){
  let team = '';
  const box = $('onboard'), tb = $('obTeam'), go = $('obGo');
  const draw = () => {
    tb.innerHTML = TEAMS.map(t => `<button class="chip ${team === t ? 'on' : ''}" data-t="${t}">${t}조</button>`).join('');
    go.disabled = !team; go.textContent = team ? `${team}조로 시작하기` : '조를 골라 주세요';
  };
  tb.onclick = e => { const b = e.target.closest('[data-t]'); if(b){ team = b.dataset.t; draw(); } };
  $('obWage').oninput = e => {
    const w = Number(e.target.value) || 0;
    $('obHourly').textContent = w ? `시급 ${won(w / (Number(S.settings.wageDiv) || 214))} (통상임금 ÷ ${S.settings.wageDiv})` : '수당 계산에 씁니다. 몰라도 비워 두고 나중에 넣을 수 있습니다.';
  };
  go.onclick = () => {
    if(!team) return;
    const st = S.settings;
    st.team = team;
    st.wage = Number($('obWage').value) || 0;
    const lv = $('obLeave').value.trim();
    if(lv !== '') st.leave = {year:new Date().getFullYear(), remain:Number(lv) || 0, asOf:todayKey(), typed:Number(lv) || 0};
    S.onboarded = true; saveNow();
    box.classList.remove('on'); renderCal(); toast(`${team}조 근무표로 시작합니다`);
  };
  draw(); box.classList.add('on');
}
function init(){
  load();
  applyTheme();
  const t = new Date(); curY = t.getFullYear(); curM = t.getMonth() + 1;
  $('prev').onclick = () => moveMonth(-1); $('next').onclick = () => moveMonth(1);
  const statMove = n => { if(statTab === 'sum'){ curY += n; sumPick = 0; renderCal(); renderStat(); } else moveMonth(n); };
  $('sprev').onclick = () => statMove(-1); $('snext').onclick = () => statMove(1);
  $('statSeg').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if(b){ statTab = b.dataset.st; renderStat(); $('statBody').scrollTop = 0; } });
  $('statBody').addEventListener('click', e => {
    const b = e.target.closest('[data-sm],[data-pm]'); if(!b) return;
    if(b.dataset.sm) sumMode = b.dataset.sm; else sumPick = Number(b.dataset.pm);
    renderStat();
  });
  $('teamBtn').onclick = () => { calAll = !calAll; renderCal(); $('grid').scrollTop = 0; };
  $('payLine').onclick = () => show('stat');
  $('todayBtn').onclick = () => { const n = new Date(); curY = n.getFullYear(); curM = n.getMonth() + 1; renderCal(); };
  $('title').onclick = () => { const n = new Date(); curY = n.getFullYear(); curM = n.getMonth() + 1; renderCal(); };
  $('grid').addEventListener('click', e => { const c = e.target.closest('.cell, .tc[data-k]'); if(c && !swiped) openDay(c.dataset.k); });
  $('extraLine').onclick = () => show('stat');
  $('mask').onclick = closeSheet; $('shClose').onclick = closeSheet;
  $('shCancel').onclick = closeSheet; $('shSave').onclick = saveDay;
  (() => {
    const sh = $('sheet'); let y0 = 0, t0 = 0, dy = 0, dragging = false;
    const start = e => {
      if(dragging || !editK || e.target.closest('button')) return; // 두 번째 손가락은 무시
      dragging = true; y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; sh.classList.add('drag');
    };
    const move = e => {
      if(!dragging) return;
      const d = e.touches[0].clientY - y0;
      dy = d > 0 ? d : -Math.sqrt(-d) * 2;   // 위로 끌면 점점 덜 움직임
      sh.style.transform = `translateY(${dy}px)`;
    };
    const end = () => {
      if(!dragging) return;
      dragging = false; sh.classList.remove('drag'); sh.style.transform = '';
      const v = dy / Math.max(1, Date.now() - t0);
      if(dy > 120 || (dy > 20 && v > 0.11)) closeSheet();
    };
    for(const el of [sh.querySelector('.grab'), sh.querySelector('.sh')]){
      el.addEventListener('touchstart', start, {passive:true});
      el.addEventListener('touchmove', move, {passive:true});
      el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    }
  })();
  $('shBody').addEventListener('click', onSheet);
  $('shBody').addEventListener('input', onSheet);
  $('shBody').addEventListener('change', onSheet);
  $('shBody').addEventListener('input', e => { if(e.target.id === 'dmemo'){ const d = dget(editK); d.memo = e.target.value; dclean(editK); save(); } });
  $('meBody').addEventListener('input', onMe);
  $('meBody').addEventListener('change', onMe);
  $('meBody').addEventListener('click', onMe);
  $('setBody').addEventListener('input', onSet);
  $('setBody').addEventListener('change', onSet);
  $('setBody').addEventListener('click', onSetClick);
  for(const b of document.querySelectorAll('nav button')) b.onclick = () => show(b.dataset.p);
  // 옆으로 밀어서 달 넘기기
  let sx = 0, sy = 0, swiped = false;
  const g = $('grid');
  g.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; }, {passive:true});
  g.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ swiped = true; moveMonth(dx < 0 ? 1 : -1); setTimeout(() => swiped = false, 300); }
  }, {passive:true});
  document.addEventListener('visibilitychange', () => { if(document.hidden) saveNow(); else if(page === 'cal') renderCal(); });
  renderCal();
  if(!S.onboarded) showOnboard();   // 처음 켠 사람: 조·통상임금·남은 연차 묻기
}
init();
</script>
